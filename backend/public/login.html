<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Background Animation -->
    <div class="bg-animation"></div>
    
    <!-- Login Container -->
    <div class="login-container">
        <div class="login-header">
            <div class="logo">
                <i class="fas fa-bolt"></i>
            </div>
            <h1 class="login-title">Transformadores ERP</h1>
            <p class="login-subtitle">Sistema de Gestión Integral</p>
        </div>
        
        <form id="loginForm" class="login-form">
            <div class="form-group">
                <i class="fas fa-user form-icon"></i>
                <input 
                    type="text" 
                    id="usuario" 
                    class="form-input" 
                    placeholder="Usuario" 
                    required 
                    autocomplete="username"
                >
            </div>
            
            <div class="form-group">
                <i class="fas fa-lock form-icon"></i>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Contraseña" 
                    required 
                    autocomplete="current-password"
                >
                <button type="button" class="password-toggle" onclick="togglePassword()">
                    <i class="fas fa-eye" id="passwordIcon"></i>
                </button>
            </div>
            
            <div class="remember-forgot">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe">
                    <span>Recordarme</span>
                </label>
                <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
            </div>
            
            <button type="submit" class="login-button" id="loginButton">
                <i class="fas fa-sign-in-alt"></i>
                <span id="buttonText">Iniciar Sesión</span>
            </button>
        </form>
        
        <div class="error-message" id="errorMessage">
            <i class="fas fa-exclamation-triangle"></i>
            <span id="errorText">Usuario o contraseña incorrectos</span>
        </div>

        <!-- Cambio obligatorio de contraseña.
             Aparece cuando se entra con la contraseña temporal que entregó el
             administrador. Está acá, en el login, porque es el único lugar por
             el que pasan todas las personas, incluidas las que trabajan en
             pantallas que todavía no usan el menú nuevo. -->
        <form id="cambioForm" class="login-form" hidden>
            <p class="login-subtitle" style="margin-bottom:16px">
                Tu contraseña es temporal. Elegí una nueva para entrar.
            </p>

            <div class="form-group">
                <i class="fas fa-lock form-icon"></i>
                <input type="password" id="pass_nueva" class="form-input"
                       placeholder="Contraseña nueva" minlength="10" required
                       autocomplete="new-password">
            </div>

            <div class="form-group">
                <i class="fas fa-lock form-icon"></i>
                <input type="password" id="pass_repetir" class="form-input"
                       placeholder="Repetir la nueva" minlength="10" required
                       autocomplete="new-password">
            </div>

            <p class="version" style="margin:-6px 0 14px">
                Al menos 10 caracteres. Una frase que recuerdes es mejor que algo
                corto y complicado.
            </p>

            <button type="submit" class="login-button" id="cambioButton">
                <span id="cambioButtonText">Guardar y entrar</span>
            </button>
        </form>

        <div class="login-footer">
            <p>&copy; 2024 Transformadores ERP</p>
            <p class="version">v2.0.0</p>
        </div>
    </div>
    
    <!-- Scripts -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/css-utilities.js"></script>
    
    <script>
        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const passwordIcon = document.getElementById('passwordIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                passwordIcon.className = 'fas fa-eye-slash';
            } else {
                passwordInput.type = 'password';
                passwordIcon.className = 'fas fa-eye';
            }
        }
        
        // Enhanced login form handling
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const usuario = document.getElementById('usuario').value.trim();
            const password = document.getElementById('password').value;
            const button = document.getElementById('loginButton');
            const buttonText = document.getElementById('buttonText');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            
            // Reset error state
            errorMessage.classList.remove('show');
            document.querySelectorAll('.form-input').forEach(input => {
                input.classList.remove('error');
            });
            
            // Validate inputs
            if (!usuario || !password) {
                errorText.textContent = 'Por favor complete todos los campos';
                errorMessage.classList.add('show');
                
                if (!usuario) document.getElementById('usuario').classList.add('error');
                if (!password) document.getElementById('password').classList.add('error');
                return;
            }
            
            // Show loading state
            button.disabled = true;
            button.classList.add('loading');
            buttonText.textContent = 'Iniciando sesión...';
            
            try {
                // Attempt login
                const response = await apiFetch('/api/auth/login', {
                    method: 'POST',
                    body: JSON.stringify({ usuario, password })
                });
                
                if (response.token) {
                    // Success - store token and redirect
                    localStorage.setItem('token', response.token);
                    // debe_cambiar_password viaja dentro del usuario guardado:
                    // Shell.montar() lo lee y abre el cambio obligatorio.
                    localStorage.setItem('usuario', JSON.stringify(
                        Object.assign({}, response.usuario, {
                            debe_cambiar_password: !!response.debe_cambiar_password
                        })
                    ));

                    // Remember me functionality
                    if (document.getElementById('rememberMe').checked) {
                        localStorage.setItem('rememberUser', usuario);
                    } else {
                        localStorage.removeItem('rememberUser');
                    }

                    // Contraseña temporal: todavía no se entra al sistema. El
                    // backend además responde 403 a todo lo demás hasta que se
                    // cambie, así que saltear este paso no serviría de nada.
                    if (response.debe_cambiar_password) {
                        mostrarCambioObligatorio(password);
                        return;
                    }

                    // Show success message
                    buttonText.textContent = '¡Acceso concedido!';
                    button.style.background = 'var(--gradient-success)';

                    // El operario solo trabaja en Producción; el admin
                    // arranca en el dashboard.
                    const destino = response.usuario.rol === 'operario'
                        ? 'produccion.html'
                        : 'dashboard.html';

                    setTimeout(() => {
                        window.location.href = destino;
                    }, 1000);
                } else {
                    throw new Error('Credenciales inválidas');
                }
                
            } catch (error) {
                // Handle error
                button.disabled = false;
                button.classList.remove('loading');
                buttonText.textContent = 'Iniciar Sesión';
                
                // Show error message
                errorText.textContent = error.message || 'Usuario o contraseña incorrectos';
                errorMessage.classList.add('show');
                
                // Add error styling to inputs
                document.getElementById('usuario').classList.add('error');
                document.getElementById('password').classList.add('error');
                
                // Shake animation
                const loginContainer = document.querySelector('.login-container');
                loginContainer.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    loginContainer.style.animation = '';
                }, 500);
            }
        });
        
        // ------------------------------------------------------------------
        // Cambio obligatorio de contraseña temporal
        // ------------------------------------------------------------------
        let passwordTemporalUsada = '';

        function mostrarCambioObligatorio(passwordActual) {
            passwordTemporalUsada = passwordActual;
            document.getElementById('loginForm').hidden = true;
            document.getElementById('errorMessage').classList.remove('show');
            const cambio = document.getElementById('cambioForm');
            cambio.hidden = false;
            document.getElementById('pass_nueva').focus();
        }

        document.getElementById('cambioForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            const nueva = document.getElementById('pass_nueva').value;
            const repetir = document.getElementById('pass_repetir').value;
            const boton = document.getElementById('cambioButton');
            const botonTexto = document.getElementById('cambioButtonText');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            function fallar(mensaje) {
                errorText.textContent = mensaje;
                errorMessage.classList.add('show');
                boton.disabled = false;
                botonTexto.textContent = 'Guardar y entrar';
            }

            errorMessage.classList.remove('show');

            if (nueva !== repetir) return fallar('Las contraseñas no coinciden.');
            if (nueva.length < 10) return fallar('La contraseña debe tener al menos 10 caracteres.');

            boton.disabled = true;
            botonTexto.textContent = 'Guardando…';

            try {
                const res = await apiFetch('/api/usuarios/cambiar-password', {
                    method: 'PUT',
                    body: JSON.stringify({
                        password_actual: passwordTemporalUsada,
                        password_nueva: nueva,
                        password_confirmacion: repetir
                    })
                });

                // El backend invalida los tokens anteriores y devuelve uno
                // nuevo: sin guardarlo, la primera pantalla daría 401.
                if (res.token) localStorage.setItem('token', res.token);

                const usuario = JSON.parse(localStorage.getItem('usuario') || '{}');
                usuario.debe_cambiar_password = false;
                localStorage.setItem('usuario', JSON.stringify(usuario));
                passwordTemporalUsada = '';

                botonTexto.textContent = '¡Listo!';
                window.location.href = usuario.rol === 'operario'
                    ? 'produccion.html'
                    : 'dashboard.html';

            } catch (err) {
                fallar((err && (err.error || err.message)) || 'No se pudo cambiar la contraseña.');
            }
        });

        // Add shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
        `;
        document.head.appendChild(style);
        
        // Load remembered user
        window.addEventListener('load', function() {
            // ?cambiar=1 lo pone js/api.js cuando una pantalla vieja (sin el
            // menú nuevo) recibe PASSWORD_CHANGE_REQUIRED: hay que volver a
            // entrar con la temporal para que aparezca el formulario de cambio.
            if (new URLSearchParams(location.search).get('cambiar') === '1') {
                const usuarioGuardado = localStorage.getItem('rememberUser');
                localStorage.removeItem('token');
                if (usuarioGuardado) localStorage.setItem('rememberUser', usuarioGuardado);
                document.getElementById('errorText').textContent =
                    'Entrá con tu contraseña temporal para elegir una nueva.';
                document.getElementById('errorMessage').classList.add('show');
            }

            const rememberedUser = localStorage.getItem('rememberUser');
            if (rememberedUser) {
                document.getElementById('usuario').value = rememberedUser;
                document.getElementById('rememberMe').checked = true;
                document.getElementById('password').focus();
            } else {
                document.getElementById('usuario').focus();
            }
        });
        
        // Recuperación de contraseña: no hay autoservicio por email, la
        // restablece el administrador desde la pantalla de Usuarios y entrega
        // una contraseña temporal de un solo uso. En vez de prometer una
        // función que no existe ("próximamente disponible"), se explica el
        // camino real.
        document.querySelector('.forgot-link').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('errorText').textContent =
                'Pedile al administrador que te la restablezca: te va a dar una ' +
                'contraseña temporal y el sistema te va a pedir que elijas una ' +
                'nueva al entrar.';
            document.getElementById('errorMessage').classList.add('show');
        });
    </script>
</body>
</html>
