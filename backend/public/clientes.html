<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Clientes</h1>
      <p>Alta y datos de contacto de los clientes</p>
    </div>
    <div class="page-head-actions">
      <button class="b b-primary" onclick="showTab('crear', event)">+ Nuevo cliente</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" onclick="showTab('crear', event)">Crear nuevo</button>
    <button class="tab active" onclick="showTab('listar', event)">Listar clientes</button>
  </div>

  <!-- TAB CREAR -->
  <div id="crear" class="tab-content">
    <form id="clienteForm">
      <div class="panel">
        <div class="panel-head">Información general</div>
        <div class="panel-body">
          <div class="form-grid">
            <div class="field ancho-total">
              <label for="nombre">Nombre del cliente *</label>
              <input class="input" type="text" id="nombre" name="nombre" required placeholder="Ej: Industrias ABC S.A.">
            </div>
            <div class="field">
              <label for="cuit">CUIT</label>
              <input class="input" type="text" id="cuit" name="cuit" placeholder="Ej: 30-12345678-9">
            </div>
            <div class="field">
              <label for="telefono">Teléfono</label>
              <input class="input" type="tel" id="telefono" name="telefono" placeholder="Ej: 11 1234-5678">
            </div>
            <div class="field">
              <label for="correo">Correo electrónico</label>
              <input class="input" type="email" id="correo" name="correo" placeholder="ejemplo@empresa.com">
            </div>
            <div class="field">
              <label for="direccion">Dirección</label>
              <input class="input" type="text" id="direccion" name="direccion" placeholder="Calle 123, Ciudad">
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">Condiciones de pago</div>
        <div class="panel-body">
          <div class="form-grid">
            <div class="field">
              <label for="forma_pago">Forma de pago</label>
              <select class="select" id="forma_pago" name="forma_pago">
                <option value="">-- Seleccionar --</option>
                <option value="contado">Contado</option>
                <option value="cheque">Cheque</option>
                <option value="transferencia">Transferencia</option>
                <option value="otro">Otro</option>
              </select>
            </div>
            <div class="field">
              <label for="dias_max_pago">Días máximo de pago</label>
              <input class="input" type="number" id="dias_max_pago" name="dias_max_pago" placeholder="Ej: 30">
            </div>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">Observaciones</div>
        <div class="panel-body">
          <div class="field ancho-total">
            <label for="observaciones">Notas adicionales sobre el cliente</label>
            <textarea class="input" style="height:80px" id="observaciones" name="observaciones" placeholder="Notas adicionales sobre el cliente..."></textarea>
          </div>
        </div>
      </div>

      <div style="display:flex; gap:var(--space-3); flex-wrap:wrap;">
        <button type="submit" class="b b-primary">Guardar cliente</button>
        <button type="button" class="b b-ghost" onclick="resetForm()">Limpiar</button>
      </div>
    </form>
  </div>

  <!-- TAB LISTAR -->
  <div id="listar" class="tab-content active">
    <div class="panel">
      <div class="panel-body flush">
        <div class="table-wrap">
          <table class="t">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>CUIT</th>
                <th>Teléfono</th>
                <th>Forma de pago</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="clientesList"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Panel lateral de detalle. Va DENTRO de [data-content] (Shell.montar
       reconstruye <body> a partir de esto y descarta lo que quede afuera). -->
  <div class="drawer-scrim" id="drawerBg"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <h2 id="drawerTitulo">Cliente</h2>
        <div class="meta" id="drawerMeta"></div>
      </div>
      <button class="b b-ghost b-sm" id="btnCerrarDrawer">Cerrar</button>
    </div>
    <div id="drawerCuerpo"></div>
  </div>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>Shell.montar({ titulo: 'Clientes' });</script>
<script src="js/roleGuard.js"></script>
<script src="js/clientes.js"></script>
<script>verificarRolPagina(['admin']);</script>
</body>
</html>
