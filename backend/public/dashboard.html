<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Panel de control</h1>
      <p id="fechaHoy">—</p>
    </div>
    <div class="page-head-actions">
      <a class="b b-ghost" href="cobros.html">Registrar cobro</a>
      <a class="b b-primary" href="facturas-compra.html">Cargar factura de compra</a>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi is-danger">
      <div class="kpi-k">Nos deben <button type="button" class="ayuda" data-ayuda="saldo">?</button></div>
      <div class="kpi-v" id="kDeudaCli">—</div>
      <div class="kpi-sub" id="kDeudaCliSub">—</div>
    </div>
    <div class="kpi is-warning">
      <div class="kpi-k">Debemos</div>
      <div class="kpi-v" id="kDeudaProv">—</div>
      <div class="kpi-sub" id="kDeudaProvSub">—</div>
    </div>
    <div class="kpi is-info">
      <div class="kpi-k">En gestión <button type="button" class="ayuda" data-ayuda="en_gestion">?</button></div>
      <div class="kpi-v" id="kGestion">—</div>
      <div class="kpi-sub" id="kGestionSub">—</div>
    </div>
    <div class="kpi is-success">
      <div class="kpi-k">Dólar BNA <button type="button" class="ayuda" data-ayuda="dolar_banco">?</button></div>
      <div class="kpi-v" id="kDolar">—</div>
      <div class="kpi-sub" id="kDolarSub">—</div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      Requiere atención
      <div class="page-head-actions">
        <a class="b b-ghost b-sm" href="alertas-pagos.html">Ver todas</a>
      </div>
    </div>
    <div class="panel-body flush">
      <div class="table-wrap">
        <table class="t">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Comprobante</th>
              <th>Vence</th>
              <th class="num">Monto</th>
              <th>Estado</th>
            </tr>
          </thead>
          <tbody id="tbAtencion"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      Cheques próximos a debitarse <button type="button" class="ayuda" data-ayuda="en_valores">?</button>
    </div>
    <div class="panel-body flush">
      <div class="table-wrap">
        <table class="t">
          <thead>
            <tr>
              <th>Proveedor</th><th>Cheque</th><th>Banco</th><th>Se debita</th><th class="num">Monto</th>
            </tr>
          </thead>
          <tbody id="tbCheques"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>
  if (!localStorage.getItem('token')) {
    window.location.href = 'login.html';
  }
</script>
<script>Shell.montar({ titulo: 'Panel de control' });</script>
<script src="js/dashboard.js"></script>
<script src="js/roleGuard.js"></script>
<script>verificarRolPagina(['admin']);</script>
</body>
</html>
