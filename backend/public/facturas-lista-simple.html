<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de facturas — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Lista de facturas</h1>
      <p>Listado simple de todas las facturas de compra</p>
    </div>
    <div class="page-head-actions">
      <button class="b b-ghost" onclick="cargarFacturas()">Recargar</button>
      <a class="b b-ghost" href="facturas-compra.html">Ver completo</a>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi">
      <div class="kpi-k">Facturas</div>
      <div class="kpi-v" id="totalFacturas">0</div>
      <div class="kpi-sub" id="contadorFacturas">Cargando…</div>
    </div>
  </div>

  <div class="panel"><div class="panel-body flush"><div class="table-wrap">
    <table class="t">
      <thead>
        <tr>
          <th>Factura</th>
          <th>Proveedor</th>
          <th class="solo-escritorio">Emisión</th>
          <th class="num">Total</th>
          <th class="num solo-escritorio">Pagado</th>
          <th class="num">Saldo</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tablaFacturasBody">
        <tr><td colspan="8" class="muted">Cargando facturas…</td></tr>
      </tbody>
    </table>
  </div></div></div>

  <!-- ================= Ventana: detalle de factura =================
       Va adentro de [data-content]: Shell.montar() reemplaza el body y solo
       conserva lo de adentro. -->
  <dialog id="detalleFacturaModal" class="panel">
    <div class="panel-head">
      <h2>Detalle de factura</h2>
      <div class="page-head-actions">
        <button class="b b-ghost b-sm" data-cerrar="detalleFacturaModal">Cerrar</button>
      </div>
    </div>
    <div class="panel-body" id="detalleFacturaContent"></div>
  </dialog>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>
  Shell.montar({ titulo: 'Facturas de compra', sub: 'Lista simple' });

  document.querySelectorAll('[data-cerrar]').forEach(b => {
    b.addEventListener('click', () => document.getElementById(b.dataset.cerrar)?.close());
  });
</script>
<script src="js/auth.js"></script>
<script src="js/roleGuard.js"></script>
<script>
  // Pantalla de datos comerciales: solo admin.
  verificarRolPagina(['admin']);
</script>
<script src="js/facturas-lista-simple.js"></script>
</body>
</html>
