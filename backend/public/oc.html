<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Órdenes de compra — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Órdenes de compra</h1>
      <p>Lo que los clientes pidieron y cuánto falta entregar</p>
    </div>
    <div class="page-head-actions">
      <button class="b b-primary" id="btnNuevaOC">Nueva orden</button>
    </div>
  </div>

  <!-- El alta arranca cerrada: lo que se mira todos los días es la lista.
       Antes este formulario solo pedía cliente/número/fecha; los items del
       pedido se cargaban después, en una pantalla aparte (oc_detalle.html),
       lo que obligaba a crear la OC, volver a esta lista y clickear "Ver"
       para recién ahí poder cargarlos. Ahora se cargan acá mismo, igual que
       en "Pedidos a proveedores" (pedidos-proveedor.html): cabecera + items
       van en un solo alta, y al crear se navega directo al detalle para
       seguir con entregas/remitos/facturación. -->
  <div class="panel" id="panelNuevaOC" hidden>
    <div class="panel-head"><h2>Nueva orden de compra</h2></div>
    <div class="panel-body">
      <form id="ocForm">
        <div class="form-grid">
          <div class="field ancho-total">
            <label for="cliente_id">Cliente</label>
            <select class="input" id="cliente_id" required>
              <option value="">Elegí un cliente…</option>
            </select>
          </div>

          <div class="field">
            <label for="numero_oc">N° de orden</label>
            <input class="input" type="text" id="numero_oc" required placeholder="Ej: OC-2026-001">
          </div>

          <div class="field">
            <label for="fecha_oc">Fecha</label>
            <input class="input" type="date" id="fecha_oc" required>
          </div>
        </div>

        <div class="table-wrap" style="margin-top:var(--space-3)">
          <table class="t">
            <thead>
              <tr>
                <th>Modelo</th>
                <th style="width:16%">Cantidad</th>
                <th style="width:4%"></th>
              </tr>
            </thead>
            <tbody id="oc_itemsBody"></tbody>
          </table>
        </div>
        <div style="padding:var(--space-3) 0">
          <button type="button" class="b b-ghost" id="btnAgregarItemOC">+ Agregar ítem</button>
        </div>

        <div class="ancho-total">
          <button type="submit" class="b b-primary">Crear orden</button>
          <button type="button" class="b b-ghost" id="btnCancelarOC">Cancelar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Búsqueda client-side: mismo patrón que las pestañas de Remitos/Órdenes
       de correcciones.html (un solo input, filtra en cada tecla sobre la
       lista ya cargada — no hace falta ir al servidor por esto). Busca por
       número de OC, cliente y también por número de remito, para poder
       encontrar una OC a partir del remito que la entregó. -->
  <div class="filters">
    <div class="field grow">
      <label for="filtroOC">Buscar</label>
      <input class="input" type="text" id="filtroOC" placeholder="Número de OC, cliente o remito">
    </div>
  </div>

  <div class="panel" style="margin-top:var(--space-4)"><div class="panel-body flush"><div class="table-wrap">
    <table class="t">
      <thead>
        <tr>
          <th>N° de orden</th>
          <th>Cliente</th>
          <th class="solo-escritorio">Fecha</th>
          <th>Estado</th>
          <th>Remitos</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="listaOC">
        <tr><td colspan="6" class="muted">Cargando…</td></tr>
      </tbody>
    </table>
  </div></div></div>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>
  Shell.montar({ titulo: 'Órdenes de compra', sub: 'Pedidos de clientes' });

  // Mostrar / ocultar el alta
  const panelNueva = document.getElementById('panelNuevaOC');
  document.getElementById('btnNuevaOC').addEventListener('click', () => {
    panelNueva.hidden = !panelNueva.hidden;
    if (!panelNueva.hidden) document.getElementById('cliente_id').focus();
  });
  document.getElementById('btnCancelarOC').addEventListener('click', () => {
    panelNueva.hidden = true;
    resetFormOC();
  });
</script>
<script src="js/auth.js"></script>
<script src="js/roleGuard.js"></script>
<script>
  verificarRolPagina(['admin']);
</script>
<script src="js/oc.js"></script>
</body>
</html>
