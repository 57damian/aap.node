<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proveedores — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Proveedores</h1>
      <p>Alta y datos de contacto de los proveedores</p>
    </div>
    <div class="page-head-actions">
      <button class="b b-primary" id="btnNuevoProveedor">+ Nuevo proveedor</button>
    </div>
  </div>

  <div class="kpi-row" id="kpis"></div>

  <div class="filters">
    <div class="field grow">
      <label for="searchInput">Buscar</label>
      <input class="input" type="search" id="searchInput" placeholder="Nombre, CUIT, email...">
    </div>
    <div class="field">
      <label for="filtroEstado">Estado</label>
      <select class="select" id="filtroEstado">
        <option value="activos">Activos</option>
        <option value="inactivos">Inactivos</option>
        <option value="todos">Todos</option>
      </select>
    </div>
    <div class="field">
      <label for="filtroDeuda">Deuda</label>
      <select class="select" id="filtroDeuda">
        <option value="todos">Todos</option>
        <option value="con-deuda">Con deuda</option>
        <option value="sin-deuda">Sin deuda</option>
      </select>
    </div>
    <div class="filters-actions">
      <button class="b b-ghost b-sm" id="btnLimpiarFiltros">Limpiar</button>
      <button class="b b-primary b-sm" id="btnBuscar">Buscar</button>
    </div>
  </div>

  <div class="panel" style="margin-top:var(--space-3)">
    <div class="panel-body flush">
      <div class="table-wrap">
        <table class="t">
          <thead>
            <tr>
              <th>Proveedor</th>
              <th>Contacto</th>
              <th class="num">Compras</th>
              <th class="num">Deuda</th>
              <th>Estado</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="proveedoresTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Panel lateral: alta/edición de proveedor y ficha de detalle. Va DENTRO
       de [data-content] (Shell.montar reconstruye <body> a partir de esto y
       descarta lo que quede afuera). Un único drawer para las tres acciones
       (Nuevo / Editar / Ver) — cambia solo el contenido que se le carga. -->
  <div class="drawer-scrim" id="drawerBg"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <div>
        <h2 id="drawerTitulo">Proveedor</h2>
        <div class="meta" id="drawerMeta"></div>
      </div>
      <button class="b b-ghost b-sm" id="btnCerrarDrawer">Cerrar</button>
    </div>
    <div id="drawerCuerpo"></div>
  </div>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>Shell.montar({ titulo: 'Proveedores' });</script>
<script src="js/roleGuard.js"></script>
<script src="js/proveedores-nuevo.js"></script>
<script>verificarRolPagina(['admin']);</script>
</body>
</html>
