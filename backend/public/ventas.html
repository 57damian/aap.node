<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Remitos y facturación — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Remitos y facturación</h1>
      <p>Cada fila es un remito entregado y muestra si ya está facturado</p>
    </div>
  </div>

  <div class="filters">
    <div class="field grow">
      <label for="filtroCliente">Cliente</label>
      <select class="input" id="filtroCliente">
        <option value="">Todos</option>
      </select>
    </div>
    <div class="field">
      <label for="filtroDesde">Desde</label>
      <input class="input" type="date" id="filtroDesde">
    </div>
    <div class="field">
      <label for="filtroHasta">Hasta</label>
      <input class="input" type="date" id="filtroHasta">
    </div>
    <div class="filters-actions">
      <label class="check">
        <input type="checkbox" id="filtroSinFacturar"><span>Solo sin facturar</span>
      </label>
      <button class="b b-primary" onclick="cargarVentas()">Aplicar</button>
      <button class="b b-ghost" onclick="limpiarFiltrosVentas()">Limpiar</button>
      <button class="b b-ghost" onclick="exportarVentasCSV()">Exportar CSV</button>
      <button class="b b-ghost" onclick="verVentasPdf()">PDF</button>
    </div>
  </div>

  <div class="panel"><div class="panel-body flush"><div class="table-wrap">
    <table class="t">
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Fecha</th>
          <th class="solo-escritorio">Remito</th>
          <th class="solo-escritorio">Orden de compra</th>
          <th class="solo-escritorio">Modelos / cantidad</th>
          <th class="solo-escritorio">Factura</th>
          <th class="solo-escritorio">Observaciones</th>
          <th>Estado</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tablaVentas">
        <tr><td colspan="9" class="muted">Cargando…</td></tr>
      </tbody>
    </table>
  </div></div></div>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>
  Shell.montar({ titulo: 'Remitos y facturación', sub: 'Entregas a clientes' });
</script>
<script src="js/auth.js"></script>
<script src="js/roleGuard.js"></script>
<script>
  verificarRolPagina(['admin']);
</script>
<script src="js/ventas.js"></script>
</body>
</html>
