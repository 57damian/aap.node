<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alertas de pago — Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
<div data-content>

  <div class="page-head">
    <div>
      <h1>Alertas de pago</h1>
      <p>Facturas de compra vencidas o por vencer</p>
    </div>
    <div class="page-head-actions">
      <button class="b b-ghost" id="refreshBtn">Actualizar</button>
      <button class="b b-ghost" id="exportBtn">Exportar CSV</button>
    </div>
  </div>

  <div class="kpi-row">
    <div class="kpi is-danger">
      <div class="kpi-k">Vencidas</div>
      <div class="kpi-v" id="vencidasCount">0</div>
    </div>
    <div class="kpi is-warning">
      <div class="kpi-k">Por vencer
        <button type="button" class="ayuda" data-ayuda="vencido">?</button>
      </div>
      <div class="kpi-v" id="porVencerCount">0</div>
    </div>
    <div class="kpi">
      <div class="kpi-k">Total facturas</div>
      <div class="kpi-v" id="totalPendientes">0</div>
    </div>
    <div class="kpi is-info">
      <div class="kpi-k">Saldo pendiente</div>
      <div class="kpi-v" id="totalMonto">$0</div>
    </div>
  </div>

  <div class="filters">
    <div class="field">
      <label for="filterEstado">Estado</label>
      <select class="input" id="filterEstado">
        <option value="">Todos</option>
        <option value="vencida">Vencida</option>
        <option value="por_vencer">Por vencer</option>
        <option value="normal">Normal</option>
      </select>
    </div>
    <div class="field">
      <label for="filterProveedor">Proveedor</label>
      <select class="input" id="filterProveedor">
        <option value="">Todos los proveedores</option>
      </select>
    </div>
    <div class="field">
      <label for="filterDesde">Vence desde</label>
      <input class="input" type="date" id="filterDesde">
    </div>
    <div class="field">
      <label for="filterHasta">Vence hasta</label>
      <input class="input" type="date" id="filterHasta">
    </div>
    <div class="field">
      <label for="filterMontoMin">Saldo mínimo</label>
      <input class="input" type="number" id="filterMontoMin" placeholder="0">
    </div>
    <div class="field">
      <label for="filterMontoMax">Saldo máximo</label>
      <input class="input" type="number" id="filterMontoMax" placeholder="Sin límite">
    </div>
    <div class="filters-actions">
      <button class="b b-ghost" id="clearFilters">Limpiar</button>
      <button class="b b-primary" id="applyFilters">Aplicar</button>
    </div>
  </div>

  <div class="panel"><div class="panel-body flush"><div class="table-wrap">
    <table class="t">
      <thead>
        <tr>
          <th>Estado</th>
          <th>Factura</th>
          <th>Proveedor</th>
          <th>Vencimiento</th>
          <th class="num">Días</th>
          <th class="num solo-escritorio">Total</th>
          <th class="num">Saldo</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="alertasBody">
        <tr><td colspan="8" class="muted">Cargando…</td></tr>
      </tbody>
    </table>
  </div></div></div>

</div>

<script src="js/ayuda.js"></script>
<script src="js/shell.js"></script>
<script src="js/api.js"></script>
<script>
  Shell.montar({ titulo: 'Alertas de pago', sub: 'Facturas de compra' });
</script>
<script src="js/auth.js"></script>
<script src="js/roleGuard.js"></script>
<script>
  verificarRolPagina(['admin']);
</script>
<script src="js/alertas-pagos.js"></script>
</body>
</html>
