<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transformadores ERP</title>
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Esta página era un segundo formulario de login, con su propio contrato
    // (guardaba rol y usuario_id aparte) y sin el cambio obligatorio de
    // contraseña temporal. Dos logins conviviendo significaba dos lugares
    // donde arreglar cualquier problema de sesión. El único login es
    // login.html; acá solo queda la redirección, que también sirve para
    // la ruta raíz del server.
    // El server manda acá cualquier ruta que no reconoce, así que si ya hay
    // sesión conviene volver al sistema en vez de al login.
    (function () {
      var hayToken = false;
      try { hayToken = !!localStorage.getItem('token'); } catch (e) { hayToken = false; }
      window.location.replace(hayToken ? 'dashboard.html' : 'login.html');
    })();
  </script>
</head>
<body>
  <p>Redirigiendo al inicio de sesión… <a href="login.html">Entrar</a></p>
</body>
</html>
